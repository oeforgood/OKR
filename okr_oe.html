.objectives-list{display:flex;flex-direction:column;gap:12px}
.obj-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}

const COLORS=['c0','c1','c2','c3','c4','c5','c6','c7','c8','c9','c10'];
const OBJ_PALETTE=['#dbeafe','#dcfce7','#fce7f3','#fef3c7','#ede9fe','#ffedd5','#e0f2fe','#f0fdf4','#fdf4ff','#fff7ed','#ecfdf5'];

function personColor(n){return COLORS[PEOPLE.indexOf(n)%COLORS.length]||'c0'}
function objStyle(i){return`background:${OBJ_PALETTE[i%11]};color:${OBJ_TEXT[i%11]}`}
function objDotColor(i){return OBJ_PALETTE[i%11]}

let state={objectives:[],subobjectives:[],keyresults:[],season:'',collapsed_obj:{},collapsed_sobj:{},filter_person:''};
let modalData={};
const STORAGE_KEY='okr_oe_v2';

async function loadData(){
  try{
    const r=await window.storage.get(STORAGE_KEY);
    if(r&&r.value){
      const s=JSON.parse(r.value);
      state.objectives=s.objectives||INITIAL_DATA.objectives;
      state.subobjectives=s.subobjectives||INITIAL_DATA.subobjectives;
      state.keyresults=s.keyresults||INITIAL_DATA.keyresults;
      state.season=s.season||INITIAL_DATA.season;
      state.collapsed_obj=s.collapsed_obj||{};
      state.collapsed_sobj=s.collapsed_sobj||{};
    } else {
      state.objectives=JSON.parse(JSON.stringify(INITIAL_DATA.objectives));
      state.subobjectives=JSON.parse(JSON.stringify(INITIAL_DATA.subobjectives));
      state.keyresults=JSON.parse(JSON.stringify(INITIAL_DATA.keyresults));
      state.season=INITIAL_DATA.season;
    }
  }catch(e){
    state.objectives=JSON.parse(JSON.stringify(INITIAL_DATA.objectives));
    state.subobjectives=JSON.parse(JSON.stringify(INITIAL_DATA.subobjectives));
    state.keyresults=JSON.parse(JSON.stringify(INITIAL_DATA.keyresults));
    state.season=INITIAL_DATA.season;
  }
  renderAll();
}

async function saveData(){
  try{
    const p={objectives:state.objectives,subobjectives:state.subobjectives,keyresults:state.keyresults,season:state.season,collapsed_obj:state.collapsed_obj,collapsed_sobj:state.collapsed_sobj};
    await window.storage.set(STORAGE_KEY,JSON.stringify(p));
    showToast();
  }catch(e){console.warn('save failed',e)}
}

function showToast(){const t=document.getElementById('saved-toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

function calcSobjProg(id){
  const krs=state.keyresults.filter(k=>k.parent===id&&!k.stop);
  if(!krs.length){const s=state.subobjectives.find(s=>s.id===id);return s?s.taux||0:0}
  const tw=krs.reduce((s,k)=>s+k.poids,0);
  if(!tw)return 0;
  return krs.reduce((s,k)=>s+(k.taux*k.poids),0)/tw;
}
function calcSobjLand(id){
  const krs=state.keyresults.filter(k=>k.parent===id&&!k.stop);
  if(!krs.length){const s=state.subobjectives.find(s=>s.id===id);return s?s.taux_land||0:0}
  const tw=krs.reduce((s,k)=>s+k.poids,0);
  if(!tw)return 0;
  return krs.reduce((s,k)=>s+(k.taux_land*k.poids),0)/tw;
}
function calcObjProg(id){
  const ss=state.subobjectives.filter(s=>s.parent===id);
  if(!ss.length){const o=state.objectives.find(o=>o.id===id);return o?o.taux||0:0}
  const tw=ss.reduce((s,o)=>s+o.poids,0);
  if(!tw)return 0;
  return ss.reduce((s,o)=>s+(calcSobjProg(o.id)*o.poids),0)/tw;
}

function applyFilter(){state.filter_person=document.getElementById('filter-person').value;renderAll()}

function isObjVisible(oid){
  if(!state.filter_person)return true;
  const fp=state.filter_person;
  const obj=state.objectives.find(o=>o.id===oid);
  if(obj&&(obj.owner===fp||obj.contributors.includes(fp)))return true;
  for(const s of state.subobjectives.filter(s=>s.parent===oid)){
    if(s.owner===fp||s.contributors.includes(fp))return true;
    if(state.keyresults.filter(k=>k.parent===s.id).some(k=>k.owner===fp||k.contributors.includes(fp)))return true;
  }
  return false;
}

function avatarHtml(n,sm=''){
  if(!n)return'';
  const cl=personColor(n);
  const ini=(PERSON_INITIALS[n]||n.substring(0,2)).toUpperCase();
  return`<div class="avatar ${cl}${sm?' avatar-sm':''}" title="${n}">${ini}</div>`;
}
function avatarsRowHtml(owner,contribs){
  const all=[owner,...(contribs||[]).filter(c=>c&&c!==owner)];
  return`<div class="avatars-row">${all.map(p=>avatarHtml(p)).join('')}</div>`;
}

function pColor(p){return p>=80?'#2d6a4f':p>=50?'#b5680f':'#c0392b'}

function renderAll(){
  document.getElementById('season-label').textContent=state.season;
  renderStats();renderObjectives();populateFilter();
}

function renderStats(){
  const n=state.objectives.length;
  const avg=state.objectives.reduce((s,o)=>s+calcObjProg(o.id),0)/Math.max(n,1);
  const krs=state.keyresults.filter(k=>!k.stop);
  const done=krs.filter(k=>k.taux>=100).length;
  const etp=state.objectives.reduce((s,o)=>s+o.etp,0);
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat-card"><div class="stat-label">Avancement global</div><div class="stat-val">${Math.round(avg)}%</div><div class="stat-sub">${n} objectifs</div></div>
    <div class="stat-card"><div class="stat-label">KR complétés</div><div class="stat-val">${done}/${krs.length}</div><div class="stat-sub">${Math.round(done/Math.max(krs.length,1)*100)}% accomplis</div></div>
    <div class="stat-card"><div class="stat-label">Capacité mobilisée</div><div class="stat-val">${etp.toFixed(1)}</div><div class="stat-sub">ETP dédiés</div></div>
    <div class="stat-card"><div class="stat-label">Équipe</div><div class="stat-val">${PEOPLE.length}</div><div class="stat-sub">contributeurs</div></div>`;
}

function populateFilter(){
  const sel=document.getElementById('filter-person');
  const cur=sel.value;
  sel.innerHTML='<option value="">Toute l'équipe</option>';
  PEOPLE.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;if(p===cur)o.selected=true;sel.appendChild(o)});
}

    if(!isObjVisible(obj.id))return;
    const prog=calcObjProg(obj.id);
    const open=!state.collapsed_obj[obj.id];
    const sobjs=state.subobjectives.filter(s=>s.parent===obj.id);
    const sobjsV=state.filter_person?sobjs.filter(s=>{
      if(s.owner===state.filter_person||s.contributors.includes(state.filter_person))return true;
      return state.keyresults.filter(k=>k.parent===s.id).some(k=>k.owner===state.filter_person||k.contributors.includes(state.filter_person));
    }):sobjs;
    h+=`<div class="obj-card">
      <div class="obj-header" onclick="toggleObj('${obj.id}')">
        <div class="obj-num" style="${objStyle(idx)}">${obj.id}</div>
        <div class="obj-title">${obj.title}</div>
        <div class="obj-meta">
          ${obj.owner?`<span class="owner-tag">${avatarHtml(obj.owner,true)} ${obj.owner}</span>`:''}
          ${obj.etp?`<span class="etp-badge">${obj.etp} ETP</span>`:''}
          <div class="progress-wrap">
            <div class="progress-track"><div class="progress-fill" style="width:${Math.min(prog,100)}%;background:${pColor(prog)}"></div></div>
            <span class="progress-pct" style="color:${pColor(prog)}">${Math.round(prog)}%</span>
          </div>
          <button class="btn-edit" onclick="event.stopPropagation();editObj('${obj.id}')" title="Modifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <span class="chevron ${open?'open':''}">▾</span>
        </div>
      </div>
      ${open?`<div class="sobj-list">${sobjsV.map(s=>renderSobj(s,idx)).join('')}<button class="btn-add-sobj" onclick="openSobjModal('${obj.id}')">+ Ajouter un sous-objectif</button></div>`:''}
    </div>`;
  });
  c.innerHTML=h||'<div class="empty-state">Aucun objectif trouvé.</div>';
}

function renderSobj(sobj,objIdx){
  const prog=calcSobjProg(sobj.id);
  const open=!state.collapsed_sobj[sobj.id];
  const krs=state.keyresults.filter(k=>k.parent===sobj.id);
  const krsV=state.filter_person?krs.filter(k=>k.owner===state.filter_person||k.contributors.includes(state.filter_person)):krs;
  const dotColor=OBJ_PALETTE[objIdx%11];
  return`<div class="sobj-item">
    <div class="sobj-header" onclick="toggleSobj('${sobj.id}')">
      <div class="sobj-dot" style="background:${dotColor}"></div>
      <div class="sobj-title">${sobj.title}</div>
      <div class="sobj-meta">
        <span class="weight-badge">${sobj.poids}%</span>
        ${sobj.owner?`<span class="owner-tag" style="font-size:11px">${avatarHtml(sobj.owner,true)} ${sobj.owner}</span>`:''}
        <div class="sobj-progress">
          <div class="sobj-track"><div class="sobj-fill" style="width:${Math.min(prog,100)}%;background:${pColor(prog)}"></div></div>
          <span class="sobj-pct" style="color:${pColor(prog)}">${Math.round(prog)}%</span>
        </div>
        <button class="btn-edit" onclick="event.stopPropagation();editSobj('${sobj.id}')" title="Modifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <span class="chevron ${open?'open':''}">▾</span>
      </div>
    </div>
    ${open?renderKRTable(krsV,sobj.id):''}
  </div>`;
}

function fmtVal(v,u){
  if(u==='oui/non')return v>=1?'<span class="bool-yes">Oui ✓</span>':'<span class="bool-no">Non</span>';
  if(u==='€')return v>=1000?(v/1000).toFixed(1)+'k€':v+'€';
  if(u==='%'){if(v<=1&&v>0)return Math.round(v*100)+'%';return Math.round(v)+'%'}
  return v%1===0?v:v.toFixed(1);
}

function renderKRTable(krs,sobjId){
  const active=krs.filter(k=>k.title);
  return`<div class="kr-section"><table class="kr-table">
    <thead><tr><th style="width:28%">Key Result</th><th>Propriétaire / Contributeurs</th><th>Poids</th><th>Départ</th><th>Actuel</th><th>Cible révisée</th><th>Cible initiale</th><th>Avancement</th><th></th></tr></thead>
    <tbody>
      ${active.map(kr=>{
        const prog=kr.taux;
        const ut=kr.unite!=='oui/non'?`<span class="unit-tag">${kr.unite}</span>`:'';
        let rClass='val-revised-same';
        if(kr.val_revise<kr.val_cible)rClass='val-revised-down';
        else if(kr.val_revise>kr.val_cible)rClass='val-revised-up';
        const revisedHtml=kr.unite==='oui/non'?'—':`<span class="${rClass}">${fmtVal(kr.val_revise,kr.unite)}</span>`;
        return`<tr class="${kr.stop?'kr-row-stop':''}">
          <td class="kr-name-cell"><div class="kr-id">${kr.id}</div><div class="kr-name-text">${kr.title}</div>${kr.stop?'<span class="stop-badge">STOP</span>':''}</td>
          <td>${avatarsRowHtml(kr.owner,kr.contributors)}</td>
          <td class="val-cell"><span class="weight-badge">${kr.poids}%</span></td>
          <td class="val-cell"><span class="val-start">${fmtVal(kr.val_depart,kr.unite)}</span>${ut}</td>
          <td class="val-cell"><span class="val-current">${fmtVal(kr.val_actuel,kr.unite)}</span></td>
          <td class="val-cell">${revisedHtml}</td>
          <td class="val-cell"><span class="val-target">${fmtVal(kr.val_cible,kr.unite)}</span></td>
          <td><div class="mini-prog"><div class="mini-track"><div class="mini-fill" style="width:${Math.min(prog,100)}%;background:${pColor(prog)}"></div></div><span class="mini-pct" style="color:${pColor(prog)}">${Math.round(prog)}%</span></div></td>
          <td><button class="btn-edit" onclick="editKR('${kr.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button></td>
        </tr>`;
      }).join('')}
      <tr class="add-kr-row"><td colspan="9"><button class="btn-add-kr" onclick="openKRModal('${sobjId}')">+ Ajouter un KR</button></td></tr>
    </tbody>
  </table></div>`;
}

function toggleObj(id){state.collapsed_obj[id]=!state.collapsed_obj[id];saveData();renderObjectives()}
function toggleSobj(id){state.collapsed_sobj[id]=!state.collapsed_sobj[id];saveData();renderObjectives()}

function krFormHtml(kr){
  const ct=kr.contributors||[];
  return`<div class="form-field"><label class="form-label">Titre du KR</label><input class="form-input" id="f-title" type="text" value="${(kr.title||'').replace(/"/g,'&quot;')}" placeholder="Action mesurable"></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Propriétaire</label>
        <select class="form-input" id="f-owner" onchange="syncOwner()"><option value="">—</option>${PEOPLE.map(p=>`<option value="${p}" ${kr.owner===p?'selected':''}>${p}</option>`).join('')}</select>
      </div>
      <div class="form-field"><label class="form-label">Poids (%)</label><input class="form-input" id="f-poids" type="number" step="5" min="0" max="100" value="${kr.poids||10}"></div>
    </div>
    <div class="form-field"><label class="form-label">Contributeurs</label>
      <div class="checkbox-group" id="contrib-grp">${PEOPLE.map(p=>`<label class="checkbox-item"><input type="checkbox" name="cb" value="${p}" ${ct.includes(p)||p===kr.owner?'checked':''}> ${p}</label>`).join('')}</div>
    </div>
    <div class="form-field"><label class="form-label">Unité</label>
      <select class="form-input" id="f-unite">${['%','nb','€','oui/non'].map(u=>`<option value="${u}" ${kr.unite===u?'selected':''}>${u}</option>`).join('')}</select>
    </div>
    <div class="form-row-3">
      <div class="form-field"><label class="form-label">Valeur départ</label><input class="form-input" id="f-depart" type="number" step="any" value="${kr.val_depart||0}"></div>
      <div class="form-field"><label class="form-label">Valeur actuelle</label><input class="form-input" id="f-actuel" type="number" step="any" value="${kr.val_actuel||0}"></div>
      <div class="form-field"><label class="form-label">Cible initiale</label><input class="form-input" id="f-cible" type="number" step="any" value="${kr.val_cible||1}"></div>
    </div>
    <div class="form-field"><label class="form-label">Cible réévaluée <span style="color:var(--text3);font-weight:400">(prévision fin de saison)</span></label><input class="form-input" id="f-revise" type="number" step="any" value="${kr.val_revise||kr.val_cible||1}"></div>
    <div class="form-field"><label class="checkbox-item" style="gap:8px"><input type="checkbox" id="f-stop" ${kr.stop?'checked':''}> Marquer STOP (KR abandonné)</label></div>
    <p class="notice">Avancement = (actuel − départ) ÷ (cible − départ) × 100</p>`;
}

function syncOwner(){
  const o=document.getElementById('f-owner').value;
  if(o)document.querySelectorAll('#contrib-grp input').forEach(b=>{if(b.value===o)b.checked=true});
}

function calcTaux(dep,act,cib,u){
  if(u==='oui/non')return act>=1?100:0;
  const span=cib-dep;
  if(!span)return act>=cib?100:0;
  return Math.max(0,Math.min(100,(act-dep)/span*100));
}

function openObjModal(){
  modalData={type:'obj',id:null};
  document.getElementById('modal-title').textContent='Nouvel objectif';
  document.getElementById('btn-delete').style.display='none';
  document.getElementById('modal-body').innerHTML=`
    <div class="form-field"><label class="form-label">Titre</label><input class="form-input" id="f-title" type="text"></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Propriétaire</label><select class="form-input" id="f-owner"><option value="">—</option>${PEOPLE.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div class="form-field"><label class="form-label">ETP</label><input class="form-input" id="f-etp" type="number" step="0.05" min="0" value="0.1"></div>
    </div>
    <div class="form-field"><label class="form-label">Priorité</label>
      <select class="form-input" id="f-priorite">${['P1','P2','P3'].map(p=>`<option value="${p}">${p}</option>`).join('')}</select>
    </div>`;
  document.getElementById('modal-overlay').classList.add('show');
}

function editObj(id){
  const obj=state.objectives.find(o=>o.id===id);if(!obj)return;
  modalData={type:'obj',id};
  document.getElementById('modal-title').textContent="Modifier l'objectif";
  document.getElementById('btn-delete').style.display='block';
  document.getElementById('modal-body').innerHTML=`
    <div class="form-field"><label class="form-label">Titre</label><input class="form-input" id="f-title" type="text" value="${obj.title.replace(/"/g,'&quot;')}"></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Propriétaire</label><select class="form-input" id="f-owner"><option value="">—</option>${PEOPLE.map(p=>`<option ${obj.owner===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="form-field"><label class="form-label">ETP</label><input class="form-input" id="f-etp" type="number" step="0.05" min="0" value="${obj.etp}"></div>
    </div>
    <div class="form-field"><label class="form-label">Priorité</label>
      <select class="form-input" id="f-priorite">${['P1','P2','P3'].map(p=>`<option value="${p}" ${obj.priorite===p?'selected':''}>${p}</option>`).join('')}</select>
    </div>`;
  document.getElementById('modal-overlay').classList.add('show');
}

function openSobjModal(parentId){
  modalData={type:'sobj',id:null,parent:parentId};
  document.getElementById('modal-title').textContent='Nouveau sous-objectif';
  document.getElementById('btn-delete').style.display='none';
  document.getElementById('modal-body').innerHTML=`
    <div class="form-field"><label class="form-label">Titre</label><input class="form-input" id="f-title" type="text"></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Propriétaire</label><select class="form-input" id="f-owner"><option value="">—</option>${PEOPLE.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div class="form-field"><label class="form-label">Poids (%)</label><input class="form-input" id="f-poids" type="number" step="5" min="0" max="100" value="20"></div>
    </div>`;
  document.getElementById('modal-overlay').classList.add('show');
}

function editSobj(id){
  const s=state.subobjectives.find(s=>s.id===id);if(!s)return;
  modalData={type:'sobj',id};
  document.getElementById('modal-title').textContent='Modifier le sous-objectif';
  document.getElementById('btn-delete').style.display='block';
  document.getElementById('modal-body').innerHTML=`
    <div class="form-field"><label class="form-label">Titre</label><input class="form-input" id="f-title" type="text" value="${s.title.replace(/"/g,'&quot;')}"></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Propriétaire</label><select class="form-input" id="f-owner"><option value="">—</option>${PEOPLE.map(p=>`<option ${s.owner===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="form-field"><label class="form-label">Poids (%)</label><input class="form-input" id="f-poids" type="number" step="5" min="0" max="100" value="${s.poids}"></div>
    </div>`;
  document.getElementById('modal-overlay').classList.add('show');
}

function openKRModal(sobjId){
  modalData={type:'kr',id:null,parent:sobjId};
  document.getElementById('modal-title').textContent='Nouveau KR';
  document.getElementById('btn-delete').style.display='none';
  document.getElementById('modal-body').innerHTML=krFormHtml({title:'',owner:'',contributors:[],poids:10,unite:'%',val_depart:0,val_actuel:0,val_revise:1,val_cible:1,stop:false});
  document.getElementById('modal-overlay').classList.add('show');
}

function editKR(id){
  const kr=state.keyresults.find(k=>k.id===id);if(!kr)return;
  modalData={type:'kr',id};
  document.getElementById('modal-title').textContent='Mettre à jour le KR';
  document.getElementById('btn-delete').style.display='block';
  document.getElementById('modal-body').innerHTML=krFormHtml(kr);
  document.getElementById('modal-overlay').classList.add('show');
}

function saveModal(){
  const{type,id,parent}=modalData;
  const getV=i=>document.getElementById(i)?.value;
  const getF=i=>parseFloat(document.getElementById(i)?.value)||0;
  if(type==='obj'){
    const title=getV('f-title').trim();if(!title)return;
    const d={title,owner:getV('f-owner'),etp:getF('f-etp'),priorite:getV('f-priorite'),contributors:[]};
    if(id){Object.assign(state.objectives.find(o=>o.id===id),d)}
    else{const nid=String(state.objectives.length+1);state.objectives.push({id:nid,...d,taux:0,taux_land:0})}
  } else if(type==='sobj'){
    const title=getV('f-title').trim();if(!title)return;
    const d={title,owner:getV('f-owner'),poids:getF('f-poids'),contributors:[]};
    if(id){Object.assign(state.subobjectives.find(s=>s.id===id),d)}
    else{const ss=state.subobjectives.filter(s=>s.parent===parent);const nid=`${parent}.${ss.length+1}`;state.subobjectives.push({id:nid,parent,...d,taux:0,taux_land:0})}
  } else if(type==='kr'){
    const title=getV('f-title').trim();if(!title)return;
    const owner=getV('f-owner');
    const unite=getV('f-unite');
    const poids=getF('f-poids');
    const dep=getF('f-depart'),act=getF('f-actuel'),cib=getF('f-cible'),rev=getF('f-revise');
    const stop=document.getElementById('f-stop').checked;
    const cbs=document.querySelectorAll('#contrib-grp input:checked');
    const contributors=Array.from(cbs).map(b=>b.value).filter(v=>v!==owner);
    const taux=Math.round(calcTaux(dep,act,cib,unite)*10)/10;
    const taux_land=Math.round(calcTaux(dep,rev,cib,unite)*10)/10;
    const d={title,owner,poids,unite,val_depart:dep,val_actuel:act,val_cible:cib,val_revise:rev,stop,contributors,taux,taux_land,priorite:stop?'STOP':''};
    if(id){Object.assign(state.keyresults.find(k=>k.id===id),d)}
    else{const kk=state.keyresults.filter(k=>k.parent===parent);const nid=`${parent}.${kk.length+1}`;state.keyresults.push({id:nid,parent,...d})}
  }
  closeModal();saveData();renderAll();
}

function deleteItem(){
  const{type,id}=modalData;if(!id)return;
  if(!confirm('Supprimer cet élément ?'))return;
  if(type==='obj')state.objectives=state.objectives.filter(o=>o.id!==id);
  else if(type==='sobj')state.subobjectives=state.subobjectives.filter(s=>s.id!==id);
  else if(type==='kr')state.keyresults=state.keyresults.filter(k=>k.id!==id);
  closeModal();saveData();renderAll();
}

function closeModal(e){
  if(e&&e.target!==document.getElementById('modal-overlay'))return;
  document.getElementById('modal-overlay').classList.remove('show');
  modalData={};
}

loadData();
</script>
</body>
</html>
